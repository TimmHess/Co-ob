

# Static SGD optimizer with OneCycle scheduler
optim: "lars"
#momentum: 0.9
weight_decay: 1e-4  # 1e-4
lr: [1.0]  # (batch_size / 256)
lr_scheduling: "onecycle_cos"
one_cycle_div_factor: [10000]
one_cycle_final_lr: [0.0001]
one_cycle_pct_start: [0.02] # 5% of the total number of iterations
grad_clipping: 1.0